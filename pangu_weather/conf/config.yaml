model:
    start_epoch: 0
    max_epoch: 2            
    patch_size: [2, 4, 4]
    embed_dim: 192
    num_heads: [6, 12, 12, 6]
    window_size: [2, 6, 12]
    student_profiles:
      pangu_lite_2d_pos288:
        architecture: PanguLite2DAttentionPosEmbed
        patch_size: [8, 8]
        embed_dim: 288
        num_heads: [6, 12, 12, 6]
        depth_blocks: [2, 6, 6, 2]
        window_size: [6, 12]
      full_192:
        patch_size: [2, 4, 4]
        embed_dim: 192
        num_heads: [6, 12, 12, 6]
      student_160:
        patch_size: [2, 4, 4]
        embed_dim: 160
        num_heads: [5, 10, 10, 5]
      pgw_lite_patch8:
        patch_size: [2, 8, 8]
        embed_dim: 192
        num_heads: [6, 12, 12, 6]
      pgw_lite_pruned_128:
        patch_size: [2, 8, 8]
        embed_dim: 128
        num_heads: [4, 8, 8, 4]
      pgw_lite_pruned_96:
        patch_size: [2, 8, 8]
        embed_dim: 96
        num_heads: [3, 6, 6, 3]
      pgw_lite_pruned_96_patch16:
        patch_size: [2, 16, 16]
        embed_dim: 96
        num_heads: [3, 6, 6, 3]
        depth_blocks: [1, 2, 2, 1]
      pgw_lite_pruned_96_patch16_full:
        patch_size: [2, 16, 16]
        embed_dim: 96
        num_heads: [3, 6, 6, 3]
      pgw_lite_pruned_96_patch16_mid:
        patch_size: [2, 16, 16]
        embed_dim: 96
        num_heads: [3, 6, 6, 3]
        depth_blocks: [1, 4, 4, 1]
      pgw_lite_pruned_64:
        patch_size: [2, 8, 8]
        embed_dim: 64
        num_heads: [2, 4, 4, 2]
      uv_a_patch8_w80_shallow:
        patch_size: [2, 8, 8]
        embed_dim: 80
        num_heads: [5, 10, 10, 5]
        depth_blocks: [1, 2, 2, 1]
      uv_s96_patch8_w96_shallow:
        patch_size: [2, 8, 8]
        embed_dim: 96
        num_heads: [3, 6, 6, 3]
        depth_blocks: [1, 2, 2, 1]
        window_size: [2, 6, 12]
      uv_b_patch8_w64_shallow:
        patch_size: [2, 8, 8]
        embed_dim: 64
        num_heads: [4, 8, 8, 4]
        depth_blocks: [1, 2, 2, 1]
      uv_e_patch8_w80_ultrashallow:
        patch_size: [2, 8, 8]
        embed_dim: 80
        num_heads: [5, 10, 10, 5]
        depth_blocks: [1, 1, 1, 1]
      uv_c_patch12_w80_shallow:
        patch_size: [2, 12, 12]
        embed_dim: 80
        num_heads: [5, 10, 10, 5]
        depth_blocks: [1, 2, 2, 1]
      uv_d_patch16_w80_shallow:
        patch_size: [2, 16, 16]
        embed_dim: 80
        num_heads: [5, 10, 10, 5]
        depth_blocks: [1, 2, 2, 1]
      # ARCHIVED/REJECTED 2026-07-13: weighted validation plateaued at 0.2003.
      pangu_selective_1441_full192:
        patch_size: [2, 8, 8]
        embed_dim: 96
        num_heads: [3, 6, 6, 3]
        depth_blocks: [1, 4, 4, 1]
        window_size: [2, 6, 12]
        mlp_ratio: 4
      selective_mlp96:
        patch_size: [2, 8, 8]
        embed_dim: 96
        num_heads: [3, 6, 6, 3]
        depth_blocks: [2, 6, 6, 2]
        window_size: [2, 6, 12]
        mlp_ratio_blocks:
          - [4, 4]
          - [4, 2, 2, 2, 2, 2]
          - [2, 2, 2, 2, 2, 2]
          - [4, 4]
    pruned_embed_dim: 160
    pruned_num_heads: [5, 10, 10, 5]
    pruned_checkpoint: "model_pruned_fp16.pth"
    pruned_train_checkpoint: "model_pruned_train.pth"
    pruned_max_epoch: 10
    default_student_profile: "student_160"
    distilled_checkpoint: "model_distilled_fp16.pth"
    distilled_train_checkpoint: "model_distilled_train.pth"
    pgw_lite_profile: "pgw_lite_patch8"
    pgw_lite_distilled_checkpoint: "model_pgw_lite_fp16.pth"
    pgw_lite_distilled_train_checkpoint: "model_pgw_lite_train.pth"
    pgw_lite_distilled_latest_checkpoint: "model_pgw_lite_latest.pth"
    pgw_lite_quantized_checkpoint: "model_pgw_lite_quantized.pth"
    quantized_checkpoint: "model_distilled_quantized.pth"
    distill_max_epoch: 20
    distill_learning_rate: 5.0e-5
    distill_ground_truth_weight: 0.3
    distill_teacher_weight: 0.5
    distill_hint_weight: 0.2
    distill_hint_layers: ["layer1", "layer2"]
    distill_steps_per_epoch: 2048
    official_checkpoint_dir: "./pangu_backups"
    patience: 50
    checkpoint_dir: "./data/checkpoints"         # AI4S，路径不可更改
    val_stride: 10

datapipe:
  name: "ERA5"
  task: "weather_forecasting"

  # dataset设定
  dataset:
    type: "hdf5"
    
    # 官方外部 ERA5 用于正式训练；ERA5_test 只用于本地流程烟雾测试。
    stats_dir: "/public/SothisAI/sharingCenter/xiaodao2026/ERA5/old-data/stats"
    static_dir: "/public/SothisAI/sharingCenter/xiaodao2026/ERA5/old-data/static"
    data_dir: "/public/SothisAI/sharingCenter/xiaodao2026/ERA5/old-data"

    train_ratio: [1980, 1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989, 1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998]
    val_ratio: [2000]
    test_ratio: [2000]

    # 本地烟雾测试配置，不应用于正式微调/蒸馏：
    # stats_dir: "../onedatasets/ERA5_test/stats/"
    # static_dir: "../onedatasets/ERA5_test/static/"
    # data_dir: "../onedatasets/ERA5_test/"
    # train_ratio: [1977]
    # val_ratio: [2005]
    # test_ratio: [2012]

    img_size: [721, 1440]    # AI4S，测试集空间分辨率为该大小，更改报错
    verbose: true
    cache: false
    # 气象变量
    channels:  ['mean_sea_level_pressure', '10m_u_component_of_wind', '10m_v_component_of_wind', '2m_temperature', 
                
                'geopotential_1000', 'geopotential_925', 'geopotential_850', 'geopotential_700', 'geopotential_600', 'geopotential_500', 
                'geopotential_400', 'geopotential_300', 'geopotential_250', 'geopotential_200', 'geopotential_150', 'geopotential_100', 'geopotential_50',
                
                'specific_humidity_1000', 'specific_humidity_925', 'specific_humidity_850', 'specific_humidity_700', 'specific_humidity_600',
                'specific_humidity_500', 'specific_humidity_400', 'specific_humidity_300', 'specific_humidity_250', 'specific_humidity_200', 
                'specific_humidity_150', 'specific_humidity_100', 'specific_humidity_50', 
                
                'temperature_1000', 'temperature_925', 'temperature_850', 'temperature_700', 'temperature_600', 'temperature_500', 'temperature_400', 
                'temperature_300', 'temperature_250', 'temperature_200','temperature_150', 'temperature_100', 'temperature_50', 
                
                'u_component_of_wind_1000', 'u_component_of_wind_925', 'u_component_of_wind_850', 'u_component_of_wind_700', 'u_component_of_wind_600', 
                'u_component_of_wind_500', 'u_component_of_wind_400', 'u_component_of_wind_300', 'u_component_of_wind_250', 'u_component_of_wind_200', 
                'u_component_of_wind_150', 'u_component_of_wind_100', 'u_component_of_wind_50', 
                
                'v_component_of_wind_1000', 'v_component_of_wind_925', 'v_component_of_wind_850', 'v_component_of_wind_700', 'v_component_of_wind_600', 
                'v_component_of_wind_500', 'v_component_of_wind_400', 'v_component_of_wind_300', 'v_component_of_wind_250', 'v_component_of_wind_200', 
                'v_component_of_wind_150', 'v_component_of_wind_100', 'v_component_of_wind_50'
                ]
    weights: [  # ---- 4 surface variables ----
                1.50,  # mean_sea_level_pressure
                0.77,  # 10m_u_component_of_wind
                0.66,  # 10m_v_component_of_wind
                3.00,  # 2m_temperature
                # ---- 13 geopotential_* (Z) ----
                3.00, 3.00, 3.00, 3.00, 3.00, 3.00, 3.00, 3.00, 3.00, 3.00, 3.00, 3.00, 3.00,
                # ---- 13 specific_humidity_* (Q) ----
                0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60,
                # ---- 13 temperature_* (T) ----
                1.50, 1.50, 1.50, 1.50, 1.50, 1.50, 1.50, 1.50, 1.50, 1.50, 1.50, 1.50, 1.50,
                # ---- 13 u_component_of_wind_* (U) ----
                0.77, 0.77, 0.77, 0.77, 0.77, 0.77, 0.77, 0.77, 0.77, 0.77, 0.77, 0.77, 0.77,
                # ---- 13 v_component_of_wind_* (V) ----
                0.54, 0.54, 0.54, 0.54, 0.54, 0.54, 0.54, 0.54, 0.54, 0.54, 0.54, 0.54, 0.54,
            ]
    variables:
      - "u10"        # 10m U wind component
      - "v10"        # 10m V wind component
      - "t2m"        # 2m temperature
      - "msl"        # Mean sea level pressure
      - "z500"       # Geopotential at 500 hPa
      - "t850"       # Temperature at 850 hPa
    
    # 时间配置
    time_range: ["2000-01-01", "2020-12-31"]
    time_steps: 1                                 # AI4S，不可更改
    time_res: 6                                   # AI4S，不可更改
    
    # 空间配置
    spatial_resolution: [0.25, 0.25]              # AI4S，不可更改
    
    # 采样配置
    num_samples: -1  # -1 表示使用全部数据
    shuffle: true
    random_seed: 42
    
    # 领域特定配置
    extra:
      levels: [500, 850, 1000]
      lat_range: [-90, 90]
      lon_range: [0, 360]
  
  # 数据转换配置
  transforms:
    - type: "Normalize"
      params:
        mean: [0.0, 0.0, 288.0, 101325.0, 50000.0, 270.0]
        std: [5.0, 5.0, 15.0, 1000.0, 5000.0, 10.0]
        keys: ["input", "target"]
    
    - type: "ToTensor"
      params:
        keys: null  # null表示转换所有numpy数组
  
  # 其他配置

  # DataLoader配置
  dataloader:
    mask_dtype: "float32"
    batch_size: 1                     # AI4S，批处理大小推理阶段不可更改
    num_workers: 12
    pin_memory: true 
    drop_last: true
    shuffle: false  # 使用sampler时设为false
    persistent_workers: false

  # 分布式配置
  distributed:
    enabled: false
    sampler: "DistributedSampler"
    rank: 0
    world_size: 1                     # AI4S，不可更改
    shuffle: true
    seed: 42
    drop_last: true
      
